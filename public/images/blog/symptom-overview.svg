<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Pet symptom overview visual</title>
  <desc id="desc">A structured symptom visual with highlighted areas to help pet parents notice concerning changes.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3f9ff" />
      <stop offset="100%" stop-color="#fef6ff" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)" rx="28" />
  <circle cx="380" cy="260" r="160" fill="#ffffff" stroke="#9ec5ee" stroke-width="4" />
  <ellipse cx="820" cy="350" rx="260" ry="175" fill="#ffffff" stroke="#d6b5ec" stroke-width="4" />
  <circle cx="315" cy="220" r="18" fill="#ffb3ab" />
  <circle cx="445" cy="220" r="18" fill="#ffb3ab" />
  <circle cx="760" cy="310" r="18" fill="#ffb3ab" />
  <circle cx="890" cy="410" r="18" fill="#ffb3ab" />
  <line x1="315" y1="220" x2="180" y2="160" stroke="#6d7b8b" stroke-width="3" />
  <line x1="760" y1="310" x2="1030" y2="240" stroke="#6d7b8b" stroke-width="3" />
  <text x="145" y="150" fill="#375168" font-size="30" font-family="Arial, sans-serif">Eye / ear / mouth changes</text>
  <text x="945" y="230" fill="#5a3f70" font-size="30" font-family="Arial, sans-serif">Coat, stool, and behavior signs</text>
  <text x="600" y="600" text-anchor="middle" fill="#5f5f5f" font-size="24" font-family="Arial, sans-serif">Use this as a visual checklist while monitoring symptoms</text>
</svg>
