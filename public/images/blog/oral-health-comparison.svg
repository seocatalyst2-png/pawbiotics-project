<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Pet oral health comparison</title>
  <desc id="desc">Visual comparison of healthy gums and teeth versus signs that need veterinary attention.</desc>
  <defs>
    <linearGradient id="bg5" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff3f7" />
      <stop offset="100%" stop-color="#eff8ff" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg5)" rx="28" />
  <rect x="80" y="100" width="500" height="470" rx="26" fill="#ffffff" stroke="#e9a9bf" stroke-width="4" />
  <rect x="620" y="100" width="500" height="470" rx="26" fill="#ffffff" stroke="#aac8e9" stroke-width="4" />
  <text x="330" y="165" text-anchor="middle" fill="#9c4364" font-size="40" font-family="Arial, sans-serif" font-weight="700">Healthy Mouth</text>
  <text x="870" y="165" text-anchor="middle" fill="#3b638d" font-size="40" font-family="Arial, sans-serif" font-weight="700">Warning Signs</text>
  <text x="150" y="245" fill="#734158" font-size="30" font-family="Arial, sans-serif">" Light pink gums</text>
  <text x="150" y="300" fill="#734158" font-size="30" font-family="Arial, sans-serif">" Mild normal breath</text>
  <text x="150" y="355" fill="#734158" font-size="30" font-family="Arial, sans-serif">" Comfortable chewing</text>
  <text x="690" y="245" fill="#345676" font-size="30" font-family="Arial, sans-serif">" Red or bleeding gums</text>
  <text x="690" y="300" fill="#345676" font-size="30" font-family="Arial, sans-serif">" Persistent foul odor</text>
  <text x="690" y="355" fill="#345676" font-size="30" font-family="Arial, sans-serif">" Drooling or pain while eating</text>
  <text x="600" y="620" text-anchor="middle" fill="#5f5f5f" font-size="24" font-family="Arial, sans-serif">Use with routine dental checks and vet guidance</text>
</svg>
