<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Normal versus abnormal pet signs</title>
  <desc id="desc">A simple comparison card showing normal pet signs on the left and warning signs on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef8f7" />
      <stop offset="100%" stop-color="#fff6eb" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" rx="28" />
  <rect x="70" y="100" width="500" height="470" rx="26" fill="#e6f7f3" stroke="#8fd8c3" stroke-width="3" />
  <rect x="630" y="100" width="500" height="470" rx="26" fill="#fff0ec" stroke="#f3b2a4" stroke-width="3" />
  <text x="320" y="165" text-anchor="middle" fill="#1f6652" font-size="44" font-family="Arial, sans-serif" font-weight="700">Normal</text>
  <text x="880" y="165" text-anchor="middle" fill="#9a3e2f" font-size="44" font-family="Arial, sans-serif" font-weight="700">Warning</text>
  <text x="130" y="240" fill="#245b49" font-size="30" font-family="Arial, sans-serif">" Mild short-lived signs</text>
  <text x="130" y="295" fill="#245b49" font-size="30" font-family="Arial, sans-serif">" Normal energy and appetite</text>
  <text x="130" y="350" fill="#245b49" font-size="30" font-family="Arial, sans-serif">" Improves with rest</text>
  <text x="130" y="405" fill="#245b49" font-size="30" font-family="Arial, sans-serif">" No breathing distress</text>
  <text x="690" y="240" fill="#8a3428" font-size="30" font-family="Arial, sans-serif">" Symptoms worsening quickly</text>
  <text x="690" y="295" fill="#8a3428" font-size="30" font-family="Arial, sans-serif">" Appetite or energy drop</text>
  <text x="690" y="350" fill="#8a3428" font-size="30" font-family="Arial, sans-serif">" Pain, blood, or severe discomfort</text>
  <text x="690" y="405" fill="#8a3428" font-size="30" font-family="Arial, sans-serif">" Breathing or collapse signs</text>
  <text x="600" y="620" text-anchor="middle" fill="#5f5f5f" font-size="24" font-family="Arial, sans-serif">Educational comparison graphic for pet triage guidance</text>
</svg>
